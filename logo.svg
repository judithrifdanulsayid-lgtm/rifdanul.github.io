<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <!-- Latar belakang gelap agar teks putih bisa terlihat. -->
  <!-- Hapus baris <rect> di bawah ini jika Anda ingin latar belakang transparan. -->
  <rect width="100%" height="100%" fill="#222222" rx="15" />

  <!-- Teks iVenth berwarna putih -->
  <text 
    x="50%" 
    y="50%" 
    font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="64" 
    font-weight="bold" 
    fill="#FFFFFF" 
    text-anchor="middle" 
    dominant-baseline="central"
  >
    iVenth
  </text>
</svg>

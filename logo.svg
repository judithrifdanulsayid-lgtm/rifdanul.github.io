<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#2997ff" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <!-- Clean Light Emblem Shield -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#ffffff" stroke="#e5e5ea" stroke-width="1.5" filter="url(#softShadow)" />
    <!-- Apple-esque minimal device / shield glyph -->
    <path d="M26 14 C23 14 20 16 19 19 C18 22 19 26 21 28 C23 30 25 32 26 35 C27 32 29 30 31 28 C33 26 34 22 33 19 C32 16 29 14 26 14 Z" fill="url(#appleBlue)" opacity="0.95" />
    <circle cx="26" cy="38" r="2.5" fill="#0071e3" />
  </g>

  <!-- Typography -->
  <text x="75" y="45" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8" fill="#1d1d1f">
    iVenth
  </text>
  <rect x="170" y="27" width="64" height="22" rx="6" fill="rgba(0, 113, 227, 0.08)" stroke="rgba(0, 113, 227, 0.25)" />
  <text x="202" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#0071e3" text-anchor="middle">
    OFFICIAL
  </text>
</svg>
